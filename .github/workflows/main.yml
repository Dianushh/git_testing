name: Python-Check-Workflow

# 1. Когда запускать? При каждом пуше в ветку main
on:
  push:
    branches: [ "main" ]

# 2. Что именно делать?
jobs:
  build-and-test:
    runs-on: ubuntu-latest # Запускаем на чистой Linux-машине

    steps:
      - name: Копируем код в облако
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Устанавливаем зависимости
        run: pip install pytest

      - name: Запускаем тесты
        run: pytest test_app.py